<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🌸 For You 🌸</title>

<style>

body{
margin:0;

display:flex;
justify-content:center;
align-items:center;

.card{
background:white;
padding:25px;
border-radius:25px;

button{
background:#ff69b4;
color:white;
border:none;
padding:12px 24px;
margin:10px;

font-size:18px;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

img{
width:100%;
max-width:320px;
border-radius:20px;

}

.big{
font-size:40px;

color:#ff1493;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>
